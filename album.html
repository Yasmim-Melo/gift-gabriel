<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Album | Nosso Cantinho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain"></div>

  <header class="topbar">
    <a class="brand" href="index.html">Nosso Cantinho</a>
    <nav class="menu">
      <a href="index.html">Inicio</a>
      <a class="active" href="album.html">Album</a>
      <a href="recados.html">Recados</a>
      <a href="historia.html">Nossa Historia</a>
    </nav>
  </header>

  <section class="hero">
    <p class="hero-kicker">Nossas Fotos</p>
    <h1>Album de Memorias</h1>
    <p class="hero-sub">Guarde aqui os registros mais fofos de voces dois.</p>
  </section>

  <main class="section-shell">
    <section class="card cinematic">
      <h2>Adicionar Fotos</h2>
      <p>Envie varias imagens para montar o mural do casal.</p>
      <div class="row">
        <input id="photoInput" type="file" accept="image/*" multiple />
        <button id="clearAlbumBtn" class="secondary" type="button">Limpar album</button>
      </div>
      <p id="albumFeedback" class="feedback"></p>
    </section>

    <section class="card cinematic">
      <h2>Mural</h2>
      <div id="albumGrid" class="album-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Cada foto, um pedacinho da nossa historia.</p>
  </footer>

  <script src="album.js"></script>
</body>
</html>
