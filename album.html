<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Álbum | Nossas Memórias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain"></div>

  <header class="topbar">
    <a class="brand" href="index.html">Nossas Memórias</a>
    <nav class="menu">
      <a href="index.html">Início</a>
      <a class="active" href="album.html">Álbum</a>
      <a href="recados.html">Recados</a>
      <a href="historia.html">Nossa História</a>
    </nav>
  </header>

  <section class="hero">
    <p class="hero-kicker">Nossas Fotos</p>
    <h1>Álbum de Memórias</h1>
    <p class="hero-sub">Alguns de nossos registros.</p>
  </section>

  <main class="section-shell">
    <section class="card cinematic">
      <h2>Filtrar Memórias</h2>
      <p>Escolha uma data,ano, ou palavra para relembrar um momento especial.</p>
      <div class="row" style="gap: 10px; display: flex; align-items: center;">
        <input id="dateFilterInput" type="text" placeholder="Ex: 2024, 2026 ou 31/05" style="flex: 1;" />
        <button id="clearFilterBtn" class="secondary" type="button" style="white-space: nowrap;">Ver Todas</button>
      </div>
      <p id="albumFeedback" class="feedback"></p>
    </section>

    <section class="card cinematic">
      <h2>Mural</h2>
      <div id="albumGrid" class="album-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Cada foto, um pedacinho da nossa história.</p>
  </footer>

  <script src="config.js"></script>
  <script src="album.js"></script>
</body>
</html>
